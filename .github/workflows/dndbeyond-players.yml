name: Update players from D&D Beyond

on:
  workflow_dispatch:   # "Run workflow" button in the Actions tab
  push:
    paths: [dndbeyond.txt]   # also runs when you edit the list of characters

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public D&D Beyond characters
        run: python tools/dndbeyond.py
      - name: Commit dndbeyond.json if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dndbeyond.json
          git diff --cached --quiet || git commit -m "Update players from D&D Beyond"
          git push
