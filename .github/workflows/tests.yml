# Runs the browser test battery on every push, so a broken change shows up as a red cross on the commit.
name: Tests
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python tests/run_tests.py
      - run: python tools/check_monsters.py
      - name: Formatting (Prettier)
        run: npx --yes prettier@3.10.1 --check .
