/* Layout: sticky head = round bar + initiative strip + turn card (current creature's attacks, statuses, death saves). Compact combat table below, tap rows to select. Number wheel + action pad docks at the bottom. Add + stat block live in a drawer. */
:root{
  /* Light: parchment. Dark (below): dark dungeon. */
  --bg:#f2ecdf; --surface:#fbf8f1; --surface2:#ebe3d2; --ink:#2a241b; --muted:#675b4a; --line:#ddd2bd;
  --accent:#7a3b2e; --accent-ink:#fbf8f1; --ok:#4e6b3a; --warn:#94651c; --bad:#9a3324;
  --display:"Cormorant Garamond",Garamond,Georgia,serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121418; --surface:#1b1e24; --surface2:#252932; --ink:#e8e4da; --muted:#a39e92; --line:#30343d;
    --accent:#c9a65c; --accent-ink:#17191e; --ok:#6faf86; --warn:#d2a04a; --bad:#e3826f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121418; --surface:#1b1e24; --surface2:#252932; --ink:#e8e4da; --muted:#a39e92; --line:#30343d;
  --accent:#c9a65c; --accent-ink:#17191e; --ok:#6faf86; --warn:#d2a04a; --bad:#e3826f; color-scheme:dark;
}
*{box-sizing:border-box}
*{font-variant-numeric:lining-nums tabular-nums!important}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body.padon{padding-bottom:345px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:44px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:44px;min-width:0}
.muted{color:var(--muted)}

.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-bottom:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-block:8px}
.round{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1;letter-spacing:.02em;text-transform:uppercase;padding-right:4px}
.round small{display:block;font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.12em}
.spacer{flex:1 1 20px}
.bar .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;padding-inline:20px}
.bar .danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}

.strip{position:relative;display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scroll-behavior:smooth}
.tok{flex:none;width:128px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 9px;display:flex;flex-direction:column;gap:2px;min-height:96px}
.tok .lab{height:1.3em;line-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tok .in{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tok .nm{font-family:var(--display);font-size:1.15rem;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.tok.now{border:2px solid var(--accent);padding:5px 8px;background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.tok.now .lab,.tok.next .lab{color:var(--accent)}
.tok.next{border:2px dashed var(--accent);padding:5px 8px}
.tok.down{opacity:.6}
.tok.sel{box-shadow:inset 0 0 0 3px var(--ok);background:color-mix(in srgb,var(--ok) 24%,var(--surface))}
.tok.sel .lab{color:var(--ok)}
.xpb{margin-top:10px;padding:8px 12px;border:1px solid var(--line,#8884);border-radius:10px;font-size:.9rem}.xpb .xbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0;background:color-mix(in srgb,currentColor 10%,transparent);position:relative}.xpb .xbar i{position:absolute;top:-2px;bottom:-2px;width:2px;background:currentColor;opacity:.5}.xpb .xbar b{display:block;height:8px;flex:none;background:var(--warn)}.xpb .xbar b.over{background:var(--bad,#c33)}
.dtop{position:sticky;top:calc(-12px - env(safe-area-inset-top,0px));z-index:3;background:var(--surface);margin:calc(-12px - env(safe-area-inset-top,0px)) -12px 8px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 6px;border-bottom:1px solid var(--line)}
.dtop .dh{margin-bottom:8px}.dh .tab .sh{display:none}.dh .cls .ic{display:none}.dtop .sub{margin-bottom:6px}
.esum{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:.85rem}
.esum .et{margin-right:4px}.esum .lv{color:var(--warn)}
.esum .ec{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:0 0 0 8px;background:var(--surface2);min-height:28px}
.esum .ec:not(:has(button)){padding-right:8px}
.esum .ec button{min-height:28px;min-width:30px;border:0;background:none;padding:0;font-weight:700;color:var(--bad)}
.dfoot{position:sticky;bottom:calc(-12px - env(safe-area-inset-bottom,0px));z-index:3;display:flex;gap:6px;background:var(--surface);margin:8px -12px calc(-12px - env(safe-area-inset-bottom,0px));padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.dfoot .add{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dfoot button[disabled]{opacity:.55}
button.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
/* Landscape phone: action pad docks to the right, table stays tappable on the left */
@media (max-height:500px) and (orientation:landscape){
  body.padon{padding-bottom:16px}
  body.padon .tw,body.padon .xpb,body.padon .env,body.padon .svb,body.padon .bar,body.padon .strip,body.padon .turn{margin-right:calc(min(330px,44vw) + 8px)}
  body .pad{left:auto;top:0;width:min(330px,44vw);border-top:0;border-left:2px solid var(--ok);overflow-y:auto;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  body .pad .pi{max-width:none}body .pad .wheelbox{width:60px;height:110px}body .pad .tbox{width:112px}body .pad .wband,body .pad .amtin,body .pad .tbox #dtype{top:33px}body .pad .wheel .sp{height:33px}body .pad .amtrow span{display:none}
  body .pad .pacts{grid-template-columns:1fr 1fr}body .pad .pacts button{min-height:36px;font-size:.85rem}
  body .pad .menu{position:fixed;left:8px;right:calc(min(330px,44vw) + 8px);top:8px;bottom:8px;width:auto;max-height:none!important}
}
/* Phone: build encounters on the go. Rows become two-line cards, toolbar becomes icons. */
@media (max-width:600px),(max-height:500px) and (orientation:landscape){
  .round{font-size:1.6rem;letter-spacing:0}
  .bar{gap:5px;flex-wrap:nowrap}
  .bar>*{flex:none}
  .bar>button{flex:0 1 44px;min-width:34px;padding-inline:4px}
  .bar .tx{display:none}
  .bar [data-act="present"]{display:none}
  body:not(.idle) .bar [data-act="clear"]:not(.armed){display:none}
  .dh{gap:4px}.dh button{flex:1 1 0;min-width:0;padding-inline:2px;font-size:.85rem}
  .dh .cls{flex:0 0 44px}.dh .tab .lg{display:none}.dh .tab .sh{display:inline}.dtop .dh .cls .tx{display:none}.dtop .dh .cls .ic{display:inline}
  .bar .primary{flex:0 1 auto;padding-inline:12px;white-space:nowrap}
  .bar .danger.armed{flex:0 1 96px;font-size:.72rem;line-height:1.1;padding:2px 4px}
  .bar .spacer{flex:1 1 0}
  .round{font-size:1.5rem}
  .tok{width:96px;min-height:72px}.tok .nm{font-size:.95rem}.tok .in{font-size:1.2rem}
  .tw #tbl,.tw #tbl tbody{display:block;min-width:0;width:100%}
  tr.grp{display:block}tr.grp th{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
  tr.r{display:grid;grid-template-columns:54px 1fr 92px;grid-template-areas:"in nm ic" "ac hp hp";align-items:center;border-top:1px solid var(--line)}
  .tw tr.r td{border-top:0;display:block;width:auto;padding:4px 6px}
  tr.r td.c-in{grid-area:in}tr.r td:nth-child(2){grid-area:nm}tr.r td.c-ac{grid-area:ac;width:auto}tr.r td.c-hp{grid-area:hp;width:auto}tr.r td.c-i{grid-area:ic}
  tr.r.fxr{grid-template-areas:"in nm nm"}tr.r.fxr td:nth-child(2){grid-column:2/4}
  tr.r td.c-hp .hpnum{gap:4px}
  .name{font-size:1.15rem}
  .num{width:46px}
  .lib .meta{font-size:.78rem}
}
/* Tablet and up: toolbar always on one line. Main labels stay; End combat and Undo are icon-only on every screen
   (names on hover) and "Tap again to clear all" wraps inside its own button instead of pushing to a new line. */
@media (min-width:601px) and (min-height:501px){
  .bar{gap:6px;flex-wrap:nowrap}
  .bar>*{flex:none}
  .bar>button{flex:0 1 auto;min-width:44px;padding-inline:10px;white-space:nowrap}
  .bar .primary{padding-inline:14px}
  .bar .spacer{flex:1 1 0}
  .bar [data-act="endc"] .tx,.bar [data-act="undo"] .tx{display:none}
  .bar .danger.armed{flex:0 1 112px;white-space:normal;font-size:.78rem;line-height:1.1;padding:2px 6px}
}

function encLoad(e,add){
  if(!add&&S.list.some(function(c){return c.kind!=='pc';})&&!confirm('Replace the current monsters and effects with \u201c'+e.name+'\u201d? Players stay.'))return '';
  if(!add){S.list=S.list.filter(function(c){return c.kind==='pc';});S.list.forEach(function(c){c.init=null;});S.turnId=null;S.round=1;}
  var names={},gmap={},roll={};S.list.forEach(function(c){names[c.name]=1;});
  JSON.parse(JSON.stringify(e.list)).forEach(function(c){
    c.id=S.next++;
    if(c.grp&&c.grp.indexOf('g')===0){gmap[c.grp]=gmap[c.grp]||'g'+c.id;c.grp=gmap[c.grp];}
    if(names[c.name]){var mm=/^(.*) (\d+)$/.exec(c.name),base=mm?mm[1]:c.name,k=mm?+mm[2]:1;while(names[base+' '+k])k++;c.name=base+' '+k;}
    names[c.name]=1;
    if(c.kind==='mon'&&S.encRoll){
      var m=MON.find(function(x){return x.id===c.monId;});
      if(m){var r=d(20)+mod(+m.abil[1]);if(c.grp){if(roll[c.grp]==null)roll[c.grp]=r;r=roll[c.grp];}c.init=r;}
    }

  pruneSel();
  return (add?'Added ':'Loaded ')+'\u201c'+e.name+'\u201d. '+(S.list.some(function(c){return c.kind==='pc'&&c.init==null;})?'Enter player initiatives, then Start combat.':'');
}

function doExport(){
  var obj={app:'encounter-tracker',version:2,edition:'2024',exported:new Date().toISOString(),state:S};
  if(CUSTOM.length&&ui.expMon!==false)obj.monsterFiles=CUSTOM;
  var name='encounter-backup-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';
  var blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
  var file=null;try{file=new File([blob],name,{type:'application/json'});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).then(function(){ui.msg='Exported.';renderDrawer();}).catch(function(e){ui.msg=(e&&e.name==='AbortError')?'Export cancelled.':'Sharing failed. Try again.';renderDrawer();});
    return;

  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);

function doImport(f){
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);var st=o&&o.app==='encounter-tracker'?o.state:null;
      if(!st||!Array.isArray(st.list)||!Array.isArray(st.lib))throw new Error('bad');
      st.list.forEach(function(c){if(typeof c.id!=='number'||typeof c.name!=='string'||!Array.isArray(c.conds)||isNaN(+c.hp)||isNaN(+c.max))throw new Error('bad');});
      var mf=Array.isArray(o.monsterFiles)?o.monsterFiles.filter(function(x){return x&&typeof x.name==='string'&&Array.isArray(x.monsters);}):null;
      S=Object.assign(S,st);fixIds();ui.sel={};ui.drawer=true;S.tab='data';
      ui.msg='Imported '+st.list.length+' combatants, '+st.lib.length+' characters, '+(S.enc||[]).length+' encounters, '+(S.fxLib||[]).length+' effect templates'+(mf?', '+mf.length+' monster files':'')+'.';
      save();if(mf){CUSTOM=mf;if(!saveCustom())ui.msg+=' Monster files too large for this device.';else{alert(ui.msg);location.reload();return;}}renderAll();
    }catch(e){ui.msg='That file is not a valid encounter export. Nothing was changed.';renderDrawer();}

}

  fetch('reference.json').then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){return phb.then(function(p){
    if(p){p.spells.forEach(function(x){x.src='PHB';j.spells.push(x);});
      Object.keys(p.aliases||{}).forEach(function(a){var t=j.spells.find(function(x){return x.n===p.aliases[a];});if(t){var c=Object.assign({},t);c.n=a;c.a=t.n;j.spells.push(c);}});

function rich(t){

  if(spRe())h=h.replace(SPRE,function(m,p1,off,str){
    var bef=str.slice(Math.max(0,off-20),off),aft=str.slice(off+m.length,off+m.length+12);
    if(AMB.indexOf(m)>=0&&!cast)return m;                                   // plain words: only in casting text
    if(/^ [A-Z][a-z]/.test(aft)||/^ attack/.test(aft))return m;               // part of a longer name: Fear Ray, Shield Bash
    if(/[A-Z][a-z]+ $/.test(bef)&&!/(?:\u2019|&#39;)s $/.test(bef))return m; // Bright Light, Long Jump (but Melf’s Acid Arrow links)

    var f=t.dataset.ed,n=t.value===''?NaN:Math.floor(+t.value);
    if(t.dataset.ex){var x=(c.x||[])[+t.dataset.i];if(x)x[t.dataset.ex]=t.value;}
    else if(f==='name'){var v=t.value.trim();if(v){c.name=v;var hh=$('#edh');if(hh)hh.textContent=v;}else t.value=c.name;}
    else if(f==='ac'){if(n>=0){c.ac=n;var la=libOf(c);if(la){la.ac=n;la.chk=false;}}else t.value=c.ac;}
    else if(f==='init'){c.init=isNaN(n)?null:n;delete c.grp;}
    else if(f==='max'){if(n>=1){var full=c.hp>=c.max;c.max=n;c.base=null;c.hp=full?n:Math.min(c.hp,n);var lh=libOf(c);if(lh){lh.hp=n;lh.hpMan=true;}var hi=dr.querySelector('[data-ed="hp"]');if(hi)hi.value=c.hp;}else t.value=c.max;}
    else if(f==='hp'){if(n>=0){c.hp=Math.min(n,c.max);t.value=c.hp;if(c.hp>0){c.ds=null;var di=c.conds.indexOf('Dead');if(di>=0)c.conds.splice(di,1);}}else t.value=c.hp;}
    else if(f==='hideBase'){c.hideBase=t.checked;}
    else if(f==='cg'){setGroup([c],t.value);var ii=dr.querySelector('[data-ed="init"]');if(ii)ii.value=c.init==null?'':c.init;}
    save();renderBoard();return;
  }
  if(t.dataset.tg){var lt=S.lib.find(function(x){return x.id===t.dataset.tg;});if(lt){lt.tags=uniq(t.value.split(',').map(function(x){return x.trim();}));save();renderDrawer();}return;}
  if(t.dataset.act==='at'){S.atTable[t.dataset.l]=t.checked;save();var ft=dr.querySelector('.dfoot');if(ft){var tmp=document.createElement('div');tmp.innerHTML=partyHTML();ft.outerHTML=tmp.querySelector('.dfoot').outerHTML;}}
  if(t.id==='fxvis')ui.fx.vis=t.checked;
  if(['fxdt','fxsv','fxst','fxdur'].indexOf(t.id)>=0)ui.fx[t.id.slice(2)]=t.value;
  if(t.id==='encroll'){S.encRoll=t.checked;save();}
  if(t.dataset.act==='rl'||t.dataset.act==='rc'){ui[t.dataset.act]=t.value;renderDrawer();}
  if(t.dataset.act==='ftype'||t.dataset.act==='fmin'||t.dataset.act==='fmax'){ui[t.dataset.act==='ftype'?'fType':(t.dataset.act==='fmin'?'fMin':'fMax')]=t.value;$('#results').innerHTML=resultsHTML();}
  if(t.id==='impfile'&&t.files&&t.files[0]){doImport(t.files[0]);t.value='';}
  if(t.id==='monfile'&&t.files&&t.files[0]){readMonFile(t.files[0],function(msg){ui.msg=msg;renderDrawer();});t.value='';}
});
function pull(){
  var ae=document.activeElement;if(!RO&&ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
  try{var r2=localStorage.getItem(KEY);if(r2){var p2=JSON.parse(r2);if(p2&&p2.list){S=Object.assign(S,p2);fixIds();pruneSel();renderAll();}}}catch(x){}
}
window.addEventListener('storage',function(e){if(e.key===KEY)pull();});
// Any tap elsewhere (or 4 s) cancels a pending "Tap again to clear" / "Sure?" confirmation
var armT=null;
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-act]'),a=t?t.dataset.act:'';
  if(ui.confirmClear&&a!=='clear'){ui.confirmClear=false;renderBar();}
  if(ui.confirmRemove&&a!=='padremove'){ui.confirmRemove=false;renderPad();}
  clearTimeout(armT);
  armT=setTimeout(function(){var c=ui.confirmClear||ui.confirmRemove;ui.confirmClear=ui.confirmRemove=false;if(c){renderBar();renderPad();}},4000);
},true);
document.addEventListener('visibilitychange',function(){if(!document.hidden)pull();});
renderAll();save();
}
var CKEY='encounter-tracker-monsters',CUSTOM=[],BUILTIN=0,MERGE={rep:0,add:0};
try{CUSTOM=JSON.parse(localStorage.getItem(CKEY)||'[]');}catch(e){CUSTOM=[];}
function saveCustom(){try{localStorage.setItem(CKEY,JSON.stringify(CUSTOM));return true;}catch(e){return false;}}
var nkey=function(n){return String(n).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim();};
function okMon(m){return m&&typeof m.name==='string'&&typeof m.id==='string'&&!isNaN(+m.ac)&&!isNaN(+m.hp)&&Array.isArray(m.abil)&&m.abil.length===6;}
function fixMon(m){['extra','traits','actions','bonus','react','leg'].forEach(function(k){if(!Array.isArray(m[k]))m[k]=[];});m.ac=+m.ac;m.hp=+m.hp;m.cr=String(m.cr==null?'0':m.cr);m.type=m.type||'';m.speed=m.speed||'';m.dice=m.dice||String(m.hp);return m;}
function mergeMon(base){
  var out=base.slice(),byName={},byId={};MERGE={rep:0,add:0};
  out.forEach(function(m,i){byName[nkey(m.name)]=i;byId[m.id]=i;});
  CUSTOM.forEach(function(f){f.monsters.forEach(function(m0){
    var m=fixMon(JSON.parse(JSON.stringify(m0))),k=nkey(m.name),i=byName[k];
    if(i==null&&byId[m.id]!=null)i=byId[m.id];
    if(i!=null){m.srcId=m.id;m.id=out[i].id;out[i]=m;MERGE.rep++;}   // keep built-in id so saved encounters still find it
    else{if(byId[m.id]!=null)m.id=m.id+'-'+out.length;byName[k]=byId[m.id]=out.length;out.push(m);MERGE.add++;}
  });});
  return out;
}
function readMonFile(file,done){
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(String(r.result).replace(/^\uFEFF/,'')),L=Array.isArray(j)?j:(j&&j.monsters);
      if(!Array.isArray(L))throw 0;
      var good=L.filter(okMon),bad=L.length-good.length;
      if(!good.length){done('No valid stat blocks found in '+file.name+'. Nothing was changed.');return;}
      var known={};CUSTOM.forEach(function(f){f.monsters.forEach(function(m){known[nkey(m.name)]=f.name;});});
      var dup=good.filter(function(m){return known[nkey(m.name)];}).length;
      var keep=CUSTOM.filter(function(f){return f.name!==file.name;});
      CUSTOM=keep.concat([{name:file.name,monsters:good}]);
      if(!saveCustom()){CUSTOM=keep;done('File too large for this device storage. Nothing was changed.');return;}
      var bk={};BOOT_BASE.forEach(function(m){bk[nkey(m.name)]=1;});
      var rep=good.filter(function(m){return bk[nkey(m.name)];}).length;
      alert('Loaded '+good.length+' stat blocks from '+file.name+':\n'+rep+' replace built-in monsters\n'+(good.length-rep)+' are new'+(dup?'\n'+dup+' also in another of your files (this newest file wins)':'')+(bad?'\n'+bad+' skipped (missing name, id, AC, HP or abilities)':'')+'\n\nThe app will now reload.');
      location.reload();
    }catch(e){done('That file is not a valid monster file. Nothing was changed.');}
  };
  r.readAsText(file);
}

// ================= 7. START-UP: load monsters.json (+ files imported on this device), then boot() =================
var BOOT_BASE=[];
fetch('monsters.json').then(function(r){return r.json();}).then(function(j){BOOT_BASE=j.monsters;BUILTIN=j.monsters.length;boot(mergeMon(j.monsters));}).catch(function(){
  document.body.insertAdjacentHTML('afterbegin','<p style="padding:20px">Could not load monsters.json. Open the app once with an internet connection.</p>');
});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
