<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Encounter Tracker</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Encounters">
<meta name="theme-color" content="#3447c9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: sticky head = round bar + initiative strip + turn card (current creature's attacks, statuses, death saves). Compact combat table below, tap rows to select. Number wheel + action pad docks at the bottom. Add + stat block live in a drawer. */
:root{
  --bg:#eceef3; --surface:#fbfbfd; --surface2:#e1e5ef; --ink:#171b2b; --muted:#5a617a; --line:#cbd0df;
  --accent:#3447c9; --accent-ink:#ffffff; --ok:#1f8a57; --warn:#a96a0c; --bad:#c0392b;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141f; --surface:#1a1f2f; --surface2:#262c42; --ink:#e8ebf6; --muted:#9aa2bd; --line:#313853;
    --accent:#8c9bff; --accent-ink:#0e1226; --ok:#4cc38a; --warn:#e0a84a; --bad:#ff7a6b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141f; --surface:#1a1f2f; --surface2:#262c42; --ink:#e8ebf6; --muted:#9aa2bd; --line:#313853;
  --accent:#8c9bff; --accent-ink:#0e1226; --ok:#4cc38a; --warn:#e0a84a; --bad:#ff7a6b; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body.padon{padding-bottom:345px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:44px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:44px;min-width:0}
.muted{color:var(--muted)}

.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-bottom:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-block:8px}
.round{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1;letter-spacing:.02em;text-transform:uppercase;padding-right:4px}
.round small{display:block;font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.12em}
.spacer{flex:1 1 20px}
.bar .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;padding-inline:20px}
.bar .danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}

.strip{position:relative;display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scroll-behavior:smooth}
.tok{flex:none;width:128px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 9px;display:flex;flex-direction:column;gap:2px;min-height:96px}
.tok .lab{height:1.05em;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tok .in{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tok .nm{font-family:var(--display);font-size:1.15rem;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.tok.now{border:2px solid var(--accent);padding:5px 8px;background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.tok.now .lab,.tok.next .lab{color:var(--accent)}
.tok.next{border:2px dashed var(--accent);padding:5px 8px}
.tok.down{opacity:.6}
.tok.sel{box-shadow:inset 0 0 0 3px var(--ok);background:color-mix(in srgb,var(--ok) 24%,var(--surface))}
.tok.sel .lab{color:var(--ok)}
.svb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.svb b{font-size:.9rem}
.env{margin-top:10px;padding:8px 12px;border:2px solid var(--warn);border-radius:10px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));display:flex;gap:10px;align-items:flex-start}
.env div{flex:1;white-space:pre-wrap;font-size:.95rem}
.env b{font-family:var(--display);font-size:1.15rem}
.env button{min-height:34px;padding:0 10px}
.enc{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px}
.enc .eh{display:flex;gap:6px;align-items:center}
.enc .eh b{flex:1;font-family:var(--display);font-size:1.2rem}
.enc .eh button{min-height:38px;padding:0 12px}
.enc .meta{font-size:.82rem;color:var(--muted)}
.enc .nt{font-size:.85rem;white-space:pre-wrap;margin-top:4px}
.data textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px;min-height:64px;resize:vertical;font-size:.95rem;margin-top:6px}
.data .search{margin:6px 0 0}
.svb button{min-height:38px;padding:2px 12px;font-weight:700}
.svb button.on,.bar button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sv{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:8px;border:2px solid var(--accent);font-family:var(--display);font-size:1.15rem;font-weight:700;vertical-align:middle;white-space:nowrap}
.sv.svp{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.sv small{font-family:var(--body);font-size:.7rem;margin-left:4px;color:var(--bad);text-transform:uppercase;letter-spacing:.06em}
.tok.pc .in::after{content:" \00B7 PC";font-size:.7rem;letter-spacing:.1em;color:var(--muted);font-family:var(--body);font-weight:700}
.mini{display:flex;flex-wrap:wrap;gap:3px}
.mini span{font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--accent) 20%,var(--surface));border:1px solid var(--accent)}
.mini .bl{background:color-mix(in srgb,var(--warn) 22%,var(--surface));border-color:var(--warn)}
.mini .dn{background:color-mix(in srgb,var(--bad) 22%,var(--surface));border-color:var(--bad)}
.tok .track{margin-top:auto}
.track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.fill{height:100%;border-radius:4px;transition:width .2s}
.fill.ok{background:var(--ok)}.fill.warn{background:var(--warn)}.fill.bad{background:var(--bad)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}.strip{scroll-behavior:auto}}

.turn{border:2px solid var(--accent);border-radius:12px;background:var(--surface);padding:8px 10px;margin-top:2px;max-height:40vh;overflow-y:auto}
.th{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.th .tn{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.1}
.th .st{font-family:var(--display);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.th .st i{font-style:normal;font-size:.75rem;letter-spacing:.1em;color:var(--muted);margin-right:3px;font-family:var(--body);font-weight:700}
.th .sp{flex:1}
.th button{min-height:36px;padding:2px 10px;font-size:.85rem}
.tc{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tc .chip{min-height:0;padding:1px 8px;font-size:.8rem}
.acts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px;margin-top:8px}
.a{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.95rem;background:var(--bg)}
.a b{font-family:var(--display);font-size:1.15rem;font-weight:700;letter-spacing:.02em;display:block}
.a.spent{opacity:.5}
.a .tg{float:right;min-height:34px;padding:2px 10px;font-size:.8rem;font-weight:700}
.turn details{margin-top:6px;font-size:.9rem}
.turn summary{cursor:pointer;color:var(--muted);font-weight:600}
.turn details p{margin:4px 0}
.fxs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px 12px;margin-top:4px}
.fx{font-size:.8rem;line-height:1.3;color:var(--muted);margin-top:2px}
.fx b{color:var(--ink)}

.ds{margin-top:4px;display:flex;flex-direction:column;gap:4px}
.dsl{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;font-size:.78rem}
.dl{font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 2px 0 6px}
.dl:first-child{margin-left:0}
.dot{display:inline-block;width:22px;height:22px;min-height:22px;border-radius:50%;border:2px solid var(--line);padding:0;vertical-align:middle;background:transparent}
.dot.s.on{background:var(--ok);border-color:var(--ok)}
.dot.f.on{background:var(--bad);border-color:var(--bad)}
.stb{margin-left:8px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.08em}
.dsb{display:flex;flex-wrap:wrap;gap:4px}
.dsb button{min-height:36px;padding:0 9px;font-size:.8rem;font-weight:700}
.dsd{font-size:.8rem;color:var(--bad);font-weight:600}

.note{margin:12px 0 0;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:.9rem}
.tw{margin-top:12px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:4px 8px;vertical-align:middle}
tr.r td{border-top:1px solid var(--line)}
tr.r{cursor:pointer}
tr.grp th{background:var(--surface2);font-family:var(--display);font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:2px 8px}
tr.grp .gb{min-height:32px;padding:0 10px;margin-left:8px;font-family:var(--body);font-size:.8rem;letter-spacing:0;text-transform:none}
tr.r.turn td{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
tr.r.turn td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
tr.r.sel td{background:color-mix(in srgb,var(--ok) 22%,var(--surface))}
tr.r.sel td:last-child{box-shadow:inset -4px 0 0 var(--ok)}
tr.r.down{opacity:.8}
tr.dead td{font-size:.85rem;color:var(--muted);padding:4px 8px;border-top:1px solid var(--line)}
tr.dead button{min-height:30px;padding:0 8px;font-size:.8rem;margin:2px 4px 2px 0}
.c-in,.c-ac{width:66px;text-align:center}
.c-hp{width:170px}
.c-i{width:92px;white-space:nowrap;text-align:right}
.num{width:54px;text-align:center;font-family:var(--display);font-size:1.3rem;font-weight:700;padding:0;min-height:40px}
.name{font-family:var(--display);font-size:1.35rem;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.tag{margin-left:6px;font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.conds{display:flex;flex-wrap:wrap;gap:4px}
.conds:empty{display:none}
.chip{min-height:30px;padding:0 9px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,var(--surface));border-color:var(--accent);font-size:.8rem;font-weight:600}
.hpnum{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;font-family:var(--display);font-variant-numeric:tabular-nums}
.hpnum .cur{font-size:1.8rem;font-weight:700;line-height:1}
.hpnum .max{font-size:1rem;color:var(--muted)}
.hpnum .temp{font-size:.85rem;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 4px}
.hpnum .state{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--bad);font-weight:700}
.c-hp .track{margin-top:3px;height:8px}
.ib{border:0;background:none;color:var(--muted);padding:0;min-height:44px;min-width:44px;font-weight:700;font-size:1.1rem}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.pad{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:2px solid var(--ok);box-shadow:0 -8px 24px rgba(0,0,0,.25);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pi{position:relative;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.pt{display:flex;gap:10px;align-items:center}
.pt .who{flex:1;min-width:0;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .who b{font-family:var(--display);font-size:1.2rem}
.pt button{min-height:36px;padding:2px 12px}
.pmain{display:flex;gap:12px;align-items:stretch}
.wheelbox{position:relative;flex:none;width:104px;height:132px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.wheel{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none}
.wheel::-webkit-scrollbar{display:none}
.wheel .sp{height:44px}
.wheel .wi{height:44px;line-height:44px;text-align:center;scroll-snap-align:center;scroll-snap-stop:always;font-family:var(--display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);cursor:pointer}
.wband{position:absolute;left:0;right:0;top:44px;height:44px;border-block:2px solid var(--ok);pointer-events:none;background:color-mix(in srgb,var(--ok) 10%,transparent)}
.wfade{position:absolute;left:0;right:0;height:40px;pointer-events:none}
.wfade.t{top:0;background:linear-gradient(var(--bg),transparent)}
.wfade.b{bottom:0;background:linear-gradient(transparent,var(--bg))}
.pr{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.amtrow{display:flex;gap:8px;align-items:center}
.amtin{width:110px;text-align:center;font-family:var(--display);font-size:2.2rem;font-weight:700;min-height:52px;padding:0}
.amtrow span{font-size:.8rem;color:var(--muted)}
.pacts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pacts button{font-weight:700;padding:0 4px;min-height:42px}
.pacts .d{color:var(--bad)}.pacts .h{color:var(--ok)}
.pacts .rm.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.menu{position:absolute;right:0;bottom:calc(100% + 12px);width:min(560px,100%);background:var(--surface);border:2px solid var(--accent);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.35);padding:10px;display:flex;flex-direction:column;gap:8px}
.mh{font-weight:700}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.mt{display:flex;gap:8px;align-items:center}.mt .mh{flex:1}.mt button{min-height:38px}
.mi{display:flex;gap:6px;align-items:center;text-align:left;min-height:38px;padding:2px 8px;font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden}
.mi .bx{font-size:1.1rem;line-height:1;filter:grayscale(1);opacity:.6}
.mi.all .bx,.mi.some .bx{filter:none;opacity:1}
.mi.some{border-style:dashed;border-color:var(--accent)}
.mi.all{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.mf{display:flex;gap:8px;justify-content:flex-end}
.add{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);z-index:40;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.25);
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 12px;overflow-y:auto;overscroll-behavior:contain}
.dh{display:flex;gap:6px;margin-bottom:12px}
.dh .tab{flex:1;font-weight:600}
.dh .tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sub{display:flex;gap:6px;margin-bottom:10px}
.sub button{flex:1;min-height:38px;font-size:.92rem}
.sub button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.seg{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.9rem;color:var(--muted)}
.seg b{min-width:78px;color:var(--ink)}
.seg button{min-height:36px;padding:2px 12px;font-size:.9rem;flex:1}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.search{width:100%;margin:6px 0 8px}
.res{display:flex;gap:6px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.resname{flex:1 1 auto;min-width:0;border:0;background:none;text-align:left;padding:2px 0;display:flex;flex-direction:column;align-items:flex-start}
.resname b{font-family:var(--display);font-size:1.25rem;font-weight:600}
.resname span{font-size:.82rem;color:var(--muted)}
.qty{width:58px;text-align:center}
.lib{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.lib label{flex:1;display:flex;gap:10px;align-items:center;min-width:0;min-height:44px}
.lib input[type=checkbox]{flex:none;width:24px;height:24px;min-height:0;accent-color:var(--accent)}
.lib .meta{font-size:.82rem;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);padding:4px 10px;font-size:1.3rem}
.row{display:flex;gap:6px;margin-top:10px}
.row input{flex:1}
.msg{margin-top:8px;font-size:.9rem;color:var(--muted)}
.sb h2{font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1;margin:0}
.sb .type{font-style:italic;color:var(--muted);margin:2px 0 10px}
.sb dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.95rem}
.sb dt{font-weight:700}.sb dd{margin:0}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;margin:10px 0;padding:8px 0;border-block:1px solid var(--line)}
.abil b{display:block;font-size:.7rem;letter-spacing:.1em;color:var(--muted)}
.abil span{font-family:var(--display);font-size:1.1rem;font-weight:600;font-variant-numeric:tabular-nums}
.sb h3{font-family:var(--display);font-size:1.2rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:12px 0 4px;border-bottom:1px solid var(--line)}
.sb p{margin:6px 0;font-size:.95rem}
.sb p b{font-style:italic}

/* Table view: what the players see */
body.present .dmonly{display:none!important}
body.present .tok{width:190px;min-height:160px;padding:12px}
body.present .tok.now,body.present .tok.next{padding:11px}
body.present .tok .in{font-size:2.4rem}
body.present .tok .nm{font-size:1.6rem}
body.present .tok .lab{font-size:.9rem}
body.present .mini span{font-size:.9rem}
body.present .big{display:block}
.big{display:none;text-align:center;padding:36px 0;font-family:var(--display)}
.big .u{font-size:3.4rem;font-weight:700;line-height:1.05}
.big .n{font-size:1.6rem;color:var(--muted);margin-top:8px}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation}
.thumb{float:right;width:88px;height:88px;object-fit:cover;border-radius:10px;margin:0 0 6px 10px;background:var(--surface2)}
.a .sec{font-family:var(--body);font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-left:6px}
.hpnum .mred{font-size:.75rem;font-weight:700;color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:0 4px}
.flt{display:flex;gap:6px;margin:0 0 8px}.flt select{flex:1;min-width:0;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0 6px;font:inherit;font-size:.9rem}
.tok.fx{background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.tok.fx .in::after{content:" \00B7 EFFECT";font-size:.7rem;letter-spacing:.1em;color:var(--muted);font-family:var(--body);font-weight:700}
.data p{margin:10px 0 4px;font-size:.92rem}
.data .row{margin-top:4px}.data .row button{flex:1}
/* Edit panel */
.ed h2{font-family:var(--display);font-size:1.7rem;margin:0}
.ed h3{font-family:var(--display);font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:14px 0 4px;border-bottom:1px solid var(--line)}
.eg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.eg label{display:flex;flex-direction:column;gap:2px;font-size:.8rem;font-weight:700;color:var(--muted)}
.eg label.w{grid-column:1/-1}
.eg label{min-width:0}.eg input{width:100%;color:var(--ink);font-size:1rem;font-weight:400}
.ex{border:1px solid var(--line);border-radius:10px;padding:6px;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.ex .er{display:flex;gap:6px}.ex .er input{flex:1}
.ex select,.ex textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px;min-height:44px}
.ex textarea{width:100%;resize:vertical;font-size:.92rem}
.cx{border:2px dashed var(--accent);border-radius:10px;padding:4px 10px;margin-bottom:10px}

/* Wide screens: selection pad docks bottom-right so the table stays tappable */

  body.padon{padding-bottom:40px}
  body.padon .tw{margin-right:396px}
  .pad{left:auto;right:16px;bottom:16px;width:376px;border:2px solid var(--ok);border-radius:14px;padding:8px 10px 10px}
  .pad .pi{max-width:none}
  .pad .wheelbox{width:84px}
  .pad .amtrow span{display:none}
  .pad .amtin{width:100%}
  .pad .pacts{grid-template-columns:1fr 1fr}
  .pad .pacts button{min-height:38px;font-size:.9rem}
  .pad .menu{right:calc(100% + 12px);bottom:0;width:540px}
  body.drawon .tw,body.drawon .env,body.drawon .svb{margin-right:446px}
  body.drawon .pad{right:462px}
  body.drawon.padon{padding-bottom:345px}
  body.drawon .pad .menu{right:auto;left:0;bottom:calc(100% + 12px)}
}

<body>
<div class="head">
  <div class="bar" id="bar"></div>
  <div class="strip" id="strip" aria-label="Initiative order"></div>
  <div class="turn dmonly" id="turn" hidden></div>
</div>
<div class="big" id="big"></div>
<div class="env dmonly" id="env" hidden></div>
<div class="svb dmonly" id="svb" hidden></div>
<div class="tw dmonly"><table id="tbl" aria-label="Combatants"></table></div>
<div class="pad dmonly" id="pad" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Add combatants and stat blocks"></aside>

<script src="statuses.js"></script>
<script>
function boot(MON){
MON.forEach(function(m){if(!m.ctype){var t=(m.type||'').split(',')[0].split(' of ').pop().trim().split(' ').pop().toLowerCase();m.ctype=t.replace(/ies$/,'y').replace(/s$/,'');}});
var TYPES=Array.from(new Set(MON.map(function(m){return m.ctype;}).filter(Boolean))).sort();
var CRS=['0','1/8','1/4','1/2'];for(var q=1;q<=30;q++)CRS.push(String(q));
var crv=function(x){return x==='1/8'?0.125:x==='1/4'?0.25:x==='1/2'?0.5:+x;};
var CONDS=['Blinded','Charmed','Deafened','Exhaustion','Frightened','Grappled','Incapacitated','Invisible','Paralyzed','Petrified','Poisoned','Prone','Restrained','Stunned','Unconscious','Concentrating'];
var FX=window.STATUS_FX||{};
var ICON={Blinded:'🙈',Charmed:'💘',Deafened:'🔇',Exhaustion:'😩',Frightened:'😱',Grappled:'🤼',Incapacitated:'💫',Invisible:'👻',Paralyzed:'⚡',Petrified:'🗿',Poisoned:'🤢',Prone:'🛌',Restrained:'⛓️',Stunned:'😵',Unconscious:'💤',Concentrating:'🧠',Dead:'💀'};
var KEY='encounter-tracker-app-v1';var RO=/[?&]view=table\b/.test(location.search);
var WMAX=200,IH=44;
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var mod=function(s){return Math.floor((s-10)/2);};
var sgn=function(n){return (n>=0?'+':'')+n;};
var d=function(n){return Math.floor(Math.random()*n)+1;};
var isDead=function(c){return c.kind==='mon'&&c.hp<=0;};
var isPcDead=function(c){return c.kind==='pc'&&c.conds.indexOf('Dead')>=0;};
var isOut=function(c){return isDead(c)||isPcDead(c);};

var S={enc:[],encRoll:true,envName:'',envNote:'',round:1,turnId:null,list:[],next:1,libNext:7,tab:'add',sub:'monsters',stat:null,atTable:{},initMode:'each',hpMode:'roll',
 lib:[{id:'l1',name:'Aria (example)',ac:16,hp:31,ib:2},{id:'l2',name:'Brom (example)',ac:18,hp:38,ib:1},{id:'l3',name:'Wren (example)',ac:14,hp:24,ib:3},
      {id:'l4',name:'Tolliver (example)',ac:12,hp:20,ib:1},{id:'l5',name:'Sable (example)',ac:15,hp:27,ib:4},{id:'l6',name:'Marek (example)',ac:17,hp:34,ib:0}]};
var ui={fx:{name:'',init:'',desc:'',vis:true},fType:'',fMin:'',fMax:'',q:'',qty:{},sel:{},amt:0,menu:false,pend:{},confirmRemove:false,confirmClear:false,msg:'',drawer:false,present:false,cardOpen:true,sv:-1,encName:'',encNote:'',svLast:1,traitsOpen:false,ignoreUntil:0};
var loaded=false;try{if(RO||sessionStorage.getItem('et-present')==='1')ui.present=true;}catch(e){}
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.list){S=Object.assign(S,p);loaded=true;}}}catch(e){}
function save(){if(RO)return;try{localStorage.setItem(KEY,JSON.stringify(S));ui.saveErr=false;}catch(e){if(!ui.saveErr){ui.saveErr=true;alert('This device\u2019s storage is full, so changes are NOT being saved. Export your encounter (Data tab), then remove a monster file you no longer need.');}}}
function fixIds(){var mx=0;S.list.forEach(function(c){c.id=+c.id;if(c.id>mx)mx=c.id;['ac','hp','max'].forEach(function(k){c[k]=Math.floor(+c[k])||0;});c.temp=Math.floor(+c.temp)||0;if(c.init!=null&&isNaN(+c.init))c.init=null;if(!Array.isArray(c.conds))c.conds=[];});if(!(S.next>mx))S.next=mx+1;}
fixIds();

function order(){
  return S.list.map(function(c,i){return [c,i];}).sort(function(a,b){
    var x=a[0].init,y=b[0].init;
    if(x==null&&y==null)return a[1]-b[1];
    if(x==null)return 1; if(y==null)return -1;
    return (y-x)||(a[1]-b[1]);
  }).map(function(p){return p[0];});
}
function stepFrom(O,i){
  var wrap=0;
  for(var k=0;k<O.length;k++){
    i++;if(i>=O.length){i=0;wrap++;}
    if(!isOut(O[i]))return {i:i,wrap:wrap};
  }
  return null;
}
function nextTurn(){
  var O=order();if(!O.length)return;
  var idx=O.findIndex(function(c){return c.id===S.turnId;});
  var r=stepFrom(O,idx);if(!r)return;
  if(idx<0)S.round=1;else S.round+=r.wrap;
  S.turnId=O[r.i].id;
}
function nextId(){
  var O=order();var idx=O.findIndex(function(c){return c.id===S.turnId;});
  if(idx<0)return null;
  for(var k=0;k<O.length;k++){
    var r=stepFrom(O,idx);if(!r)return null;
    var c=O[r.i];if(c.id===S.turnId)return null;
    if(!shown(c)){idx=r.i;continue;}
    return c.id;
  }
  return null;
}
function rollHP(dice,fallback){
  var m=/^(\d+)d(\d+)(?:([+-])(\d+))?$/.exec(String(dice||'').replace(/\s+/g,'').replace('\u2212','-'));if(!m)return fallback;
  var t=0;for(var i=0;i<+m[1];i++)t+=d(+m[2]);
  if(m[3])t+=(m[3]==='+'?1:-1)*(+m[4]);
  return Math.max(1,t);
}
function addMon(id,qty){
  var m=MON.find(function(x){return x.id===id;});if(!m)return;
  var existing=S.list.filter(function(c){return c.monId===id;});
  var n0=existing.length;
  if(n0===1&&existing[0].name===m.name)existing[0].name=m.name+' 1';
  var pre=m.name+' ';existing.forEach(function(c){var k=c.name.indexOf(pre)===0?+c.name.slice(pre.length):NaN;if(k>n0)n0=k;});
  var im=mod(m.abil[1]);
  var shared=d(20)+im,grp=qty>1?'g'+S.next:null;
  for(var i=1;i<=qty;i++){
    var hp=S.hpMode==='roll'?rollHP(m.dice,m.hp):m.hp;
    var init=S.initMode==='group'?shared:d(20)+im;
    S.list.push({id:S.next++,kind:'mon',monId:id,name:(qty>1||n0>0)?m.name+' '+(n0+i):m.name,init:init,ac:m.ac,hp:hp,max:hp,temp:0,conds:[],cr:m.cr,spent:{},grp:grp});
  }
}
function gkey(c){return c.cg?'cg:'+c.cg.toLowerCase():c.monId;}
function setGroup(T,name){
  T=T.filter(function(c){return c.kind==='mon';});
  name=(name||'').trim();
  if(!name){T.forEach(function(c){delete c.cg;if(c.grp&&c.grp.indexOf('c:')===0)delete c.grp;});return T.length;}
  var key='c:'+name.toLowerCase();
  var old=S.list.filter(function(c){return c.grp===key&&c.cg&&T.indexOf(c)<0&&!isDead(c);});
  var ins=T.map(function(c){return c.init;}).filter(function(v){return v!=null;});
  var init=old.length?old[0].init:(ins.length?Math.max.apply(null,ins):null);
  if(old.length)name=old[0].cg;
  T.forEach(function(c){c.cg=name;c.grp=key;c.init=init;});
  var mem=S.list.filter(function(c){return c.grp===key;}),at=S.list.indexOf(mem[0]);
  var rest=S.list.filter(function(c){return c.grp!==key;});
  rest.splice(S.list.slice(0,at).filter(function(c){return c.grp!==key;}).length,0,mem[0]);
  rest.splice.apply(rest,[rest.indexOf(mem[0])+1,0].concat(mem.slice(1)));
  S.list=rest;return T.length;
}
function addPc(l){
  if(S.list.some(function(c){return c.libId===l.id;}))return false;
  S.list.push({id:S.next++,kind:'pc',libId:l.id,name:l.name,init:null,ib:l.ib,ac:l.ac,hp:l.hp,max:l.hp,temp:0,conds:[],cr:'',spent:{},ds:null});
  return true;
}
function dsOf(c){if(!c.ds)c.ds={s:0,f:0};return c.ds;}
var CAUSE=['Paralyzed','Petrified','Stunned','Unconscious'];
function incSync(c,added){
  var has=CAUSE.some(function(x){return c.conds.indexOf(x)>=0;}),i=c.conds.indexOf('Incapacitated');
  if(i<0)c.autoInc=false;
  if(has&&i<0&&added){c.conds.push('Incapacitated');c.autoInc=true;}
  else if(!has&&c.autoInc&&i>=0){c.conds.splice(i,1);c.autoInc=false;}
}
function shown(c){return c.kind!=='fx'||c.vis||!ui.present;}
function rmComb(c){if(c.id===S.turnId)S.turnId=nextIdExcluding([c]);S.list=S.list.filter(function(x){return x.id!==c.id;});pruneSel();}
function maxDown(c,n){if(c.base==null)c.base=c.max;c.max=Math.max(0,c.max-n);c.hp=Math.min(c.hp,c.max);if(c.max<=0){c.hp=0;if(c.kind==='pc')setDead(c);}}
function maxReset(c){if(c.base!=null){c.max=c.base;c.base=null;}}
function setDead(c){if(c.conds.indexOf('Dead')<0)c.conds.push('Dead');}
function addFail(c,n){var ds=dsOf(c);ds.f=Math.min(3,ds.f+n);if(ds.f>=3)setDead(c);}
function dmg(c,n){
  var before=c.hp;
  var t=Math.min(c.temp,n);c.temp-=t;n-=t;
  c.hp=Math.max(0,c.hp-n);
  if(c.kind==='pc'&&n>0&&!isPcDead(c)){
    if(before>0&&c.hp===0){c.ds={s:0,f:0};if(n-before>=c.max)setDead(c);}
    else if(before===0){var ds=dsOf(c);if(ds.s>=3)ds.s=0;addFail(c,1);if(n>=c.max)setDead(c);}
  }
}
function heal(c,n){
  c.hp=Math.min(c.max,c.hp+n);
  if(c.hp>0){c.ds=null;var i=c.conds.indexOf('Dead');if(i>=0)c.conds.splice(i,1);}
}
function dsAct(c,act,b){
  var ds=dsOf(c);
  if(act==='dsS'){ds.s=Math.min(3,ds.s+1);}
  else if(act==='dsF'){addFail(c,1);}
  else if(act==='ds1'){addFail(c,2);}
  else if(act==='ds20'){c.hp=1;c.ds=null;var i=c.conds.indexOf('Dead');if(i>=0)c.conds.splice(i,1);}
  else if(act==='dsdec'){
    var k=b.dataset.k;ds[k]=Math.max(0,ds[k]-1);
    if(k==='f'&&ds.f<3){var j=c.conds.indexOf('Dead');if(j>=0)c.conds.splice(j,1);}
  }
}

function fxHTML(c,cls){
  if(!c.conds.length)return '';
  return '<div class="'+(cls||'')+'">'+c.conds.map(function(x){return '<div class="fx"><b>'+esc(x)+'.</b> '+esc(FX[x]||'')+'</div>';}).join('')+'</div>';
}
function dsHTML(c){
  if(c.kind!=='pc'||c.hp>0||isPcDead(c))return '';
  var ds=dsOf(c);
  function dots(k,n){var s='';for(var i=0;i<3;i++)s+=i<n?'<button class="dot '+k+' on" data-act="dsdec" data-k="'+k+'" aria-label="Remove one"></button>':'<span class="dot '+k+'"></span>';return s;}
  return '<div class="ds"><div class="dsl"><span class="dl">Saves</span>'+dots('s',ds.s)+'<span class="dl">Fails</span>'+dots('f',ds.f)+(ds.s>=3?'<span class="stb">Stable</span>':'')+'</div>'+
    '<div class="dsb"><button data-act="dsS">Success</button><button data-act="dsF">Fail</button><button data-act="ds20">Nat 20</button><button data-act="ds1">Nat 1</button></div></div>';
}
function renderBar(){
  if(RO){$('#bar').innerHTML='<div class="round"><small>Round</small>'+S.round+'</div>';return;}
  var started=S.turnId!=null;
  $('#bar').innerHTML=
   '<div class="round"><small>Round</small>'+S.round+'</div>'+
   '<button class="primary" data-act="next">'+(started?'Next turn ▸':'Start combat')+'</button>'+
   '<span class="spacer"></span>'+
   '<button class="dmonly" data-act="openadd">+ Add</button>'+
   '<button class="dmonly'+(ui.sv>=0?' on':'')+'" data-act="saves" title="Show saving throw modifiers">Saves</button>'+
   '<button data-act="present">'+(ui.present?'Exit table view':'Table view')+'</button>'+
   '<button class="danger dmonly'+(ui.confirmClear?' armed':'')+'" data-act="clear">'+(ui.confirmClear?'Tap again to clear all':'Clear')+'</button>';
}
function tokHTML(c,isNext){
  if(c.kind==='fx'){var nw=c.id===S.turnId;return '<div class="tok fx'+(nw?' now':'')+(isNext?' next':'')+'"><div class="lab">'+(nw?'Up now':(isNext?'Next':''))+'</div><div class="in">'+(c.init==null?'\u2014':c.init)+'</div><div class="nm">'+esc(c.name)+'</div><div class="mini">'+(c.vis?'':'<span>Hidden</span>')+'</div></div>';}
  var now=c.id===S.turnId,down=c.hp<=0||isPcDead(c);
  var pct=c.max?Math.max(0,Math.min(100,c.hp/c.max*100)):0;
  var lvl=pct>50?'ok':(pct>25?'warn':'bad');
  var tags=c.conds.filter(function(x){return x!=='Dead';}).map(function(x){return '<span>'+esc(x)+'</span>';});
  if(c.base!=null&&c.max>0)tags.push('<span>Max HP \u2212'+(c.base-c.max)+'</span>');
  if(isPcDead(c))tags.unshift('<span class="dn">Dead</span>');
  else if(c.hp<=0)tags.unshift('<span class="dn">'+(c.kind==='pc'?'Down':'Dead')+'</span>');
  else if(c.kind==='mon'&&c.hp*2<=c.max)tags.unshift('<span class="bl">Bloodied</span>');
  var showBar=c.kind==='pc'||!ui.present;
  return '<div class="tok '+c.kind+(now?' now':'')+(isNext?' next':'')+(down?' down':'')+(ui.sel[c.id]&&!ui.present?' sel':'')+'">'+
    '<div class="lab">'+(now?'Up now':(isNext?'Next':''))+'</div>'+
    '<div class="in">'+(c.init==null?'—':c.init)+'</div>'+
    '<div class="nm">'+esc(c.name)+'</div>'+
    '<div class="mini">'+tags.join('')+'</div>'+
    (showBar?'<div class="track"><div class="fill '+lvl+'" style="width:'+pct+'%"></div></div>':'')+
  '</div>';
}
function grpTokHTML(g,nid){
  var cur=g.find(function(c){return c.id===S.turnId;}),nx=!cur&&g.some(function(c){return c.id===nid;});
  var up=g.filter(function(c){return c.hp>0;}),bl=up.filter(function(c){return c.hp*2<=c.max;}).length;
  var hp=0,mx=0;g.forEach(function(c){hp+=Math.max(0,c.hp);mx+=c.max;});var pct=mx?hp/mx*100:0,lvl=pct>50?'ok':(pct>25?'warn':'bad');
  var nm=g[0].cg||(MON.find(function(m){return m.id===g[0].monId;})||{name:g[0].name}).name+' Group';
  var ns=ui.present?0:g.filter(function(c){return ui.sel[c.id];}).length;
  return '<div class="tok mon'+(cur?' now':'')+(nx?' next':'')+(ns?' sel':'')+'"><div class="lab">'+(cur?'Up: '+esc(cur.name):(nx?'Next':''))+'</div><div class="in">'+g[0].init+'</div><div class="nm">'+esc(nm)+'</div>'+
   '<div class="mini"><span>×'+up.length+'</span>'+(ns&&ns<g.length?'<span>'+ns+' selected</span>':'')+(bl?'<span class="bl">'+bl+' bloodied</span>':'')+(g.length>up.length?'<span class="dn">'+(g.length-up.length)+' down</span>':'')+'</div>'+
   (ui.present?'':'<div class="track"><div class="fill '+lvl+'" style="width:'+pct+'%"></div></div>')+'</div>';
}
function renderStrip(){
  var O=order().filter(function(c){return shown(c)&&(!isOut(c)||c.id===S.turnId);}),nid=nextId();
  var strip=$('#strip');
  var G=[];O.forEach(function(c){var g=G[G.length-1];if(c.grp&&g&&g[0].grp===c.grp&&g[0].init===c.init)g.push(c);else G.push([c]);});
  strip.innerHTML=O.length?G.map(function(g){return g.length>1?grpTokHTML(g,nid):tokHTML(g[0],g[0].id===nid);}).join(''):'<div class="muted" style="padding:12px">Add combatants to build the initiative order.</div>';
  var cur=strip.querySelector('.now');
  if(cur){strip.scrollLeft=Math.max(0,cur.offsetLeft-(strip.clientWidth-cur.offsetWidth)/2);}
  var c1=S.list.find(function(c){return c.id===S.turnId;}),c2=S.list.find(function(c){return c.id===nid;});
  $('#big').innerHTML=(c1&&!shown(c1))?'':c1?'<div class="u">'+esc(c1.name)+' is up</div>'+(c2?'<div class="n">Next: '+esc(c2.name)+'</div>':''):'<div class="n">Combat is about to begin</div>';
}
function short(t){
  return t.replace('Melee or Ranged Attack Roll: ','Melee/ranged ').replace('Melee Attack Roll: ','Melee ').replace('Ranged Attack Roll: ','Ranged ')
   .replace('Melee or Ranged Weapon Attack: ','Melee/ranged ').replace('Melee Weapon Attack: ','Melee ').replace('Ranged Weapon Attack: ','Ranged ')
   .replace(' to hit','').replace(', one target. Hit: ',' \u2192 ').replace(' Hit: ',' \u2192 ');
}
function renderTurn(){
  var el=$('#turn');
  var c=S.list.find(function(x){return x.id===S.turnId;});
  if(!c){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  if(c.kind==='fx'){el.innerHTML='<div class="th"><span class="tn">'+esc(c.name)+'</span><span class="st"><i>EFFECT</i>init '+c.init+'</span><span class="sp"></span><button data-act="fxvis">'+(c.vis?'Visible to players':'Hidden from players')+'</button><button data-act="fxrm">Remove</button></div>'+(c.desc?'<p style="margin:6px 0 0">'+esc(c.desc)+'</p>':'');return;}
  var m=c.kind==='mon'?MON.find(function(x){return x.id===c.monId;}):null;
  var chips=c.conds.map(function(x){return '<button class="chip" data-act="cond" data-c="'+esc(x)+'" title="Remove '+esc(x)+'">'+esc(x)+' ×</button>';}).join('');
  var h='<div class="th"><span class="tn">'+esc(c.name)+'</span>'+
    '<span class="st"><i>AC</i>'+c.ac+'</span><span class="st"><i>HP</i>'+c.hp+'/'+c.max+(c.base!=null?' (max \u2212'+(c.base-c.max)+')':'')+(c.temp>0?' +'+c.temp:'')+'</span>'+
    (m?'<span class="st"><i>SPEED</i>'+esc(m.speed)+'</span><span class="st"><i>CR</i>'+esc(m.cr)+'</span>':'<span class="st muted">'+(c.kind==='pc'?'Player turn':'Stat block not loaded')+'</span>')+
    '<span class="sp"></span>'+'<button data-act="tedit">Edit</button>'+(m?'<button data-act="tinfo">Full stat block</button>':'')+
    '<button data-act="tcol">'+(ui.cardOpen?'Hide':'Show')+'</button></div>';
  if(chips)h+='<div class="tc">'+chips+'</div>';
  h+=fxHTML(c,'fxs');
  h+=dsHTML(c);
  var X=c.x||[];
  if(ui.cardOpen&&(m||X.length)){
    var acts=[];

function doExport(){
  var obj={app:'encounter-tracker',version:1,edition:'2024',exported:new Date().toISOString(),state:S};
  var name='encounter-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';
  var blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
  var file=null;try{file=new File([blob],name,{type:'application/json'});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).then(function(){ui.msg='Exported.';renderDrawer();}).catch(function(e){ui.msg=(e&&e.name==='AbortError')?'Export cancelled.':'Sharing failed. Try again.';renderDrawer();});
    return;
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
  ui.msg='Saved '+name+' to your downloads.';
}
function doImport(f){
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);var st=o&&o.app==='encounter-tracker'?o.state:null;
      if(!st||!Array.isArray(st.list)||!Array.isArray(st.lib))throw new Error('bad');
      st.list.forEach(function(c){if(typeof c.id!=='number'||typeof c.name!=='string'||!Array.isArray(c.conds)||isNaN(+c.hp)||isNaN(+c.max))throw new Error('bad');});
      S=Object.assign(S,st);fixIds();ui.sel={};ui.drawer=true;S.tab='data';
      ui.msg='Imported '+st.list.length+' combatants and '+st.lib.length+' saved characters.';
      save();renderAll();
    }catch(e){ui.msg='That file is not a valid encounter export. Nothing was changed.';renderDrawer();}
  };
  r.onerror=function(){ui.msg='Could not read that file.';renderDrawer();};
  r.readAsText(f);
}

function parseChar(t){

  else if(t.id==='fxinit')ui.fx.init=t.value;
  else if(t.id==='fxdesc')ui.fx.desc=t.value;
  else if(t.id==='encname')ui.encName=t.value;
  else if(t.id==='encnote')ui.encNote=t.value;
});
dr.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.ed||t.dataset.ex){
    var c=findC(S.edit);if(!c)return;
    var f=t.dataset.ed,n=t.value===''?NaN:Math.floor(+t.value);
    if(t.dataset.ex){var x=(c.x||[])[+t.dataset.i];if(x)x[t.dataset.ex]=t.value;}
    else if(f==='name'){var v=t.value.trim();if(v){c.name=v;var hh=$('#edh');if(hh)hh.textContent=v;}else t.value=c.name;}
    else if(f==='ac'){if(n>=0)c.ac=n;else t.value=c.ac;}
    else if(f==='init'){c.init=isNaN(n)?null:n;delete c.grp;}
    else if(f==='max'){if(n>=1){var full=c.hp>=c.max;c.max=n;c.base=null;c.hp=full?n:Math.min(c.hp,n);var hi=dr.querySelector('[data-ed="hp"]');if(hi)hi.value=c.hp;}else t.value=c.max;}
    else if(f==='hp'){if(n>=0){c.hp=Math.min(n,c.max);t.value=c.hp;if(c.hp>0){c.ds=null;var di=c.conds.indexOf('Dead');if(di>=0)c.conds.splice(di,1);}}else t.value=c.hp;}
    else if(f==='hideBase'){c.hideBase=t.checked;}
    else if(f==='cg'){setGroup([c],t.value);var ii=dr.querySelector('[data-ed="init"]');if(ii)ii.value=c.init==null?'':c.init;}
    save();renderBoard();return;
  }
  if(t.dataset.act==='at'){S.atTable[t.dataset.l]=t.checked;save();}
  if(t.id==='fxvis')ui.fx.vis=t.checked;
  if(t.id==='encroll'){S.encRoll=t.checked;save();}
  if(t.dataset.act==='ftype'||t.dataset.act==='fmin'||t.dataset.act==='fmax'){ui[t.dataset.act==='ftype'?'fType':(t.dataset.act==='fmin'?'fMin':'fMax')]=t.value;$('#results').innerHTML=resultsHTML();}
  if(t.id==='impfile'&&t.files&&t.files[0]){doImport(t.files[0]);t.value='';}
  if(t.id==='monfile'&&t.files&&t.files[0]){readMonFile(t.files[0],function(msg){ui.msg=msg;renderDrawer();});t.value='';}
});
function pull(){
  var ae=document.activeElement;if(!RO&&ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
  try{var r2=localStorage.getItem(KEY);if(r2){var p2=JSON.parse(r2);if(p2&&p2.list){S=Object.assign(S,p2);fixIds();pruneSel();renderAll();}}}catch(x){}
}
window.addEventListener('storage',function(e){if(e.key===KEY)pull();});
// Any tap elsewhere (or 4 s) cancels a pending "Tap again to clear" / "Sure?" confirmation
var armT=null;
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-act]'),a=t?t.dataset.act:'';
  if(ui.confirmClear&&a!=='clear'){ui.confirmClear=false;renderBar();}
  if(ui.confirmRemove&&a!=='padremove'){ui.confirmRemove=false;renderPad();}
  clearTimeout(armT);
  armT=setTimeout(function(){var c=ui.confirmClear||ui.confirmRemove;ui.confirmClear=ui.confirmRemove=false;if(c){renderBar();renderPad();}},4000);
},true);
document.addEventListener('visibilitychange',function(){if(!document.hidden)pull();});
renderAll();save();
}
var CKEY='encounter-tracker-monsters',CUSTOM=[],BUILTIN=0,MERGE={rep:0,add:0};
try{CUSTOM=JSON.parse(localStorage.getItem(CKEY)||'[]');}catch(e){CUSTOM=[];}
function saveCustom(){try{localStorage.setItem(CKEY,JSON.stringify(CUSTOM));return true;}catch(e){return false;}}
var nkey=function(n){return String(n).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim();};
function okMon(m){return m&&typeof m.name==='string'&&typeof m.id==='string'&&!isNaN(+m.ac)&&!isNaN(+m.hp)&&Array.isArray(m.abil)&&m.abil.length===6;}
function fixMon(m){['extra','traits','actions','bonus','react','leg'].forEach(function(k){if(!Array.isArray(m[k]))m[k]=[];});m.ac=+m.ac;m.hp=+m.hp;m.cr=String(m.cr==null?'0':m.cr);m.type=m.type||'';m.speed=m.speed||'';m.dice=m.dice||String(m.hp);return m;}
function mergeMon(base){
  var out=base.slice(),byName={},byId={};MERGE={rep:0,add:0};
  out.forEach(function(m,i){byName[nkey(m.name)]=i;byId[m.id]=i;});
  CUSTOM.forEach(function(f){f.monsters.forEach(function(m0){
    var m=fixMon(JSON.parse(JSON.stringify(m0))),k=nkey(m.name),i=byName[k];
    if(i==null&&byId[m.id]!=null)i=byId[m.id];
    if(i!=null){m.srcId=m.id;m.id=out[i].id;out[i]=m;MERGE.rep++;}   // keep built-in id so saved encounters still find it
    else{if(byId[m.id]!=null)m.id=m.id+'-'+out.length;byName[k]=byId[m.id]=out.length;out.push(m);MERGE.add++;}
  });});
  return out;
}
function readMonFile(file,done){
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(String(r.result).replace(/^\uFEFF/,'')),L=Array.isArray(j)?j:(j&&j.monsters);
      if(!Array.isArray(L))throw 0;
      var good=L.filter(okMon),bad=L.length-good.length;
      if(!good.length){done('No valid stat blocks found in '+file.name+'. Nothing was changed.');return;}
      var known={};CUSTOM.forEach(function(f){f.monsters.forEach(function(m){known[nkey(m.name)]=f.name;});});
      var dup=good.filter(function(m){return known[nkey(m.name)];}).length;
      var keep=CUSTOM.filter(function(f){return f.name!==file.name;});
      CUSTOM=keep.concat([{name:file.name,monsters:good}]);
      if(!saveCustom()){CUSTOM=keep;done('File too large for this device storage. Nothing was changed.');return;}
      var bk={};BOOT_BASE.forEach(function(m){bk[nkey(m.name)]=1;});
      var rep=good.filter(function(m){return bk[nkey(m.name)];}).length;
      alert('Loaded '+good.length+' stat blocks from '+file.name+':\n'+rep+' replace built-in monsters\n'+(good.length-rep)+' are new'+(dup?'\n'+dup+' also in another of your files (this newest file wins)':'')+(bad?'\n'+bad+' skipped (missing name, id, AC, HP or abilities)':'')+'\n\nThe app will now reload.');
      location.reload();
    }catch(e){done('That file is not a valid monster file. Nothing was changed.');}
  };
  r.readAsText(file);
}
var BOOT_BASE=[];
fetch('monsters.json').then(function(r){return r.json();}).then(function(j){BOOT_BASE=j.monsters;BUILTIN=j.monsters.length;boot(mergeMon(j.monsters));}).catch(function(){
  document.body.insertAdjacentHTML('afterbegin','<p style="padding:20px">Could not load monsters.json. Open the app once with an internet connection.</p>');
});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
