<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<!-- Security policy (second lock behind the file checks and esc()): only this site's own script files run, so script hidden in
     data cannot; and the page can only send or fetch data at the hosts in connect-src (Supabase for the remote session, Discord
     for webhooks, and the hosts "Your files by link" reads). A new host must be added here and to LINKHOSTS in js/boot.js. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://discord.com https://*.discord.com https://discordapp.com https://*.discordapp.com https://www.googleapis.com https://*.googleusercontent.com https://*.dropboxusercontent.com https://gist.githubusercontent.com https://raw.githubusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>Encounter Tracker</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Encounters">
<meta name="theme-color" content="#7a3b2e" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
<link rel="preload" as="script" href="js/rules.js">
<link rel="preload" as="script" href="js/state.js">
<link rel="preload" as="script" href="js/bar.js">
<link rel="preload" as="script" href="js/actions.js">
<link rel="preload" as="script" href="js/board.js">
<link rel="preload" as="script" href="js/drawer.js">
<link rel="preload" as="script" href="js/datatab.js">
<link rel="preload" as="script" href="js/sheet.js">
<link rel="preload" as="script" href="js/parser.js">
<link rel="preload" as="script" href="js/events.js">
<link rel="preload" as="script" href="js/session.js">
</head>
<body>
<div class="head">
  <div class="bar" id="bar"></div>
  <div class="strip" id="strip" aria-label="Initiative order"></div>
  <div class="turn dmonly" id="turn" hidden></div>
</div>
<div class="big" id="big"></div>
<div class="env dmonly" id="env" hidden></div>
<div class="xpb dmonly" id="xpb" hidden></div>
<div class="tw dmonly"><table id="tbl" aria-label="Combatants"></table></div>
<div class="pad dmonly" id="pad" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Add combatants and stat blocks"></aside>

<script src="statuses.js"></script>
<!-- The program: js/boot.js loads monsters.json, then the parts in js/ (see the code map at the top of js/boot.js). -->
<script src="js/boot.js"></script>
</body></html>
